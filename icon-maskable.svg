<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background: launchers apply their own mask shape, so no rounded corners here -->
  <rect width="512" height="512" fill="#0e1116"/>
  <!-- Artwork kept within the maskable safe zone (central ~80%) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1f2630" stroke-width="38"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#4cc2ff" stroke-width="38"
          stroke-linecap="round" stroke-dasharray="613" stroke-dashoffset="195"
          transform="rotate(-90 256 256)"/>
  <text x="256" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif"
        font-size="104" font-weight="800" fill="#e8edf2">T</text>
  <text x="256" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif"
        font-size="34" font-weight="700" fill="#a78bfa" letter-spacing="4">CAL</text>
</svg>
